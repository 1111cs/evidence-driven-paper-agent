services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: evidence-driven-paper-agent-postgres
    environment:
      POSTGRES_DB: paper_agent
      POSTGRES_USER: paper_agent
      POSTGRES_PASSWORD: paper_agent
    ports:
      - "54333:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_agent -d paper_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - paper_agent_postgres_data:/var/lib/postgresql/data

volumes:
  paper_agent_postgres_data:
